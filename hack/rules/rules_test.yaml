# Unit tests of the chart's alerts (hack/rules/test.sh, make test-rules).
rule_files: [rules.yaml]
evaluation_interval: 1m
tests:
  - name: infected and errors by namespace
    interval: 1m
    input_series:
      - series: 'meles_operator_infected{job="meles-operator-metrics",namespace="shop",report="replicaset-web-5d8f-app",workload_kind="Deployment",workload="web",container="app",image="reg/web:1.2"}'
        values: '2x10'
      - series: 'meles_operator_infected{job="meles-operator-metrics",namespace="shop",report="cronjob-backup-tar",workload_kind="CronJob",workload="backup",container="tar",image="reg/tools:3"}'
        values: '1x10'
      - series: 'meles_operator_reports{job="meles-operator-metrics",namespace="shop",status="Clean"}'
        values: '5x10'
      - series: 'meles_operator_reports{job="meles-operator-metrics",namespace="db",status="Error"}'
        values: '1x420'
      - series: 'meles_operator_infected{job="other",namespace="db",report="x",workload_kind="Pod",workload="x",container="x",image="x"}'
        values: '1x10'
    alert_rule_test:
      - eval_time: 1m
        alertname: MelesInfectedWorkload
        exp_alerts:
          - exp_labels: {severity: critical, namespace: shop, report: replicaset-web-5d8f-app, workload_kind: Deployment, workload: web, container: app, image: "reg/web:1.2"}
            exp_annotations:
              summary: Malware found in Deployment shop/web.
              description: "Container app of Deployment shop/web runs reg/web:1.2, findings: 2. Details: kubectl -n shop get malwarereport replicaset-web-5d8f-app -o yaml. A false positive belongs in a MalwareIgnore with a reason."
              url: https://meles.example/cluster/shop/replicaset-web-5d8f-app
          - exp_labels: {severity: critical, namespace: shop, report: cronjob-backup-tar, workload_kind: CronJob, workload: backup, container: tar, image: "reg/tools:3"}
            exp_annotations:
              summary: Malware found in CronJob shop/backup.
              description: "Container tar of CronJob shop/backup runs reg/tools:3, findings: 1. Details: kubectl -n shop get malwarereport cronjob-backup-tar -o yaml. A false positive belongs in a MalwareIgnore with a reason."
              url: https://meles.example/cluster/shop/cronjob-backup-tar
      - eval_time: 5h
        alertname: MelesScanErrors
        exp_alerts: []
      - eval_time: 7h
        alertname: MelesScanErrors
        exp_alerts:
          - exp_labels: {severity: warning, namespace: db}
            exp_annotations:
              summary: Images in db could not be scanned.
              description: "MalwareReports in Error in db: 1, for longer than the operator's retries, so those images are not scanned. The report's error names the cause, e.g. a refused pull."
              url: https://meles.example/cluster?namespace=db&status=error

  - name: operator down and without leader
    interval: 1m
    input_series:
      - series: 'up{job="meles-operator-metrics",pod="a"}'
        values: '1x5 0x20'
      - series: 'meles_operator_leader{job="meles-operator-metrics",pod="a"}'
        values: '1x5 0x20'
    alert_rule_test:
      - eval_time: 10m
        alertname: MelesOperatorDown
        exp_alerts: []
      - eval_time: 20m
        alertname: MelesOperatorDown
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: No meles operator replica is reachable.
              description: "Prometheus reaches no replica of the meles operator: new images are not scanned, and with the scan gate new pods in gated namespaces are admitted ungated (fail-open) or held."
      - eval_time: 20m
        alertname: MelesOperatorNoLeader
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: No meles operator replica is the leader.
              description: "The operator runs, but no replica holds the leader lease, so nothing is scanned."
              url: https://meles.example/cluster

  - name: operator never scraped
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 15m
        alertname: MelesOperatorDown
        exp_alerts:
          - exp_labels: {severity: critical, job: meles-operator-metrics}
            exp_annotations:
              summary: No meles operator replica is reachable.
              description: "Prometheus reaches no replica of the meles operator: new images are not scanned, and with the scan gate new pods in gated namespaces are admitted ungated (fail-open) or held."

  - name: stuck queue, but not a busy one
    interval: 1m
    input_series:
      - series: 'meles_operator_scan_queue{job="meles-operator-metrics",priority="new"}'
        values: '3x120'
      # Scans finish during the first 30 minutes, then none.
      - series: 'meles_operator_scans_total{job="meles-operator-metrics",status="Clean"}'
        values: '0+1x30 30x90'
    alert_rule_test:
      - eval_time: 40m
        alertname: MelesScanQueueStuck
        exp_alerts: []
      - eval_time: 80m
        alertname: MelesScanQueueStuck
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: Image scans wait, but none finished for 30 minutes.
              description: "Queued scans: 3, and no scan finished within 30 minutes. Check clamd and the operator's log."
              url: https://meles.example/cluster

  - name: scan gate
    interval: 1m
    input_series:
      - series: 'meles_operator_gate_held_pods{job="meles-operator-metrics",pod="a"}'
        values: '0x5 2x40'
      - series: 'meles_operator_gate_released_total{job="meles-operator-metrics",pod="a",scan="unscanned"}'
        values: '0x10 1x30'
    alert_rule_test:
      - eval_time: 20m
        alertname: MelesGatePodsHeld
        exp_alerts: []
      - eval_time: 40m
        alertname: MelesGatePodsHeld
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: The meles scan gate holds pods.
              description: "Pods held by the scan gate: 2 (for at least as long as this alert waited). An image is Infected, cannot be resolved or pulled, or (enforce) was scanned incompletely. The Cluster page of meles server and the ScanGateHeld events name the reasons."
              url: https://meles.example/cluster
      - eval_time: 12m
        alertname: MelesGateReleasedUnscanned
        exp_alerts:
          - exp_labels: {severity: warning}
            exp_annotations:
              summary: The meles scan gate released pods without a complete scan.
              description: "The scan gate released pods without a complete scan (an outage of clamd with failOpen, or audit mode). The ScanGateReleasedUnscanned events name the pods."
              url: https://meles.example/cluster
      - eval_time: 35m
        alertname: MelesGateReleasedUnscanned
        exp_alerts: []
