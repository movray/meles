name: ci
on:
  push:
    branches: [main]
  pull_request:

# Actions come from mirrors on this Gitea instance (DEFAULT_ACTIONS_URL=self),
# pinned to commit SHAs.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: sugras/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: sugras/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - run: make lint
      - run: make test
