name: ci
on:
  push:
    branches: [main]
  pull_request:

# No third-party actions: the instance requires sign-in to view (and clone)
# anything, and act_runner clones actions anonymously. The jobs run in the
# Go image and fetch the code with the job token instead.
jobs:
  test:
    runs-on: ubuntu-latest
    container:
      # Keep the Go version in line with go.mod.
      image: docker.io/library/golang:1.26-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af
    steps:
      - name: checkout
        env:
          TOKEN: ${{ gitea.token }}
          REPO: ${{ gitea.server_url }}/${{ gitea.repository }}.git
          SHA: ${{ gitea.sha }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth=1 "$REPO" "$SHA"
          git checkout -q FETCH_HEAD
      - run: make lint
      # The rule index embedded in meles must match charts/meles/rules.
      - name: YARA rule index
        run: |
          go generate ./internal/yararules
          git diff --exit-code internal/yararules
      - run: make test
      # Operator tests against a real API server and etcd (downloaded binaries).
      - run: make test-envtest

  # The chart's Prometheus alerts with promtool, the YARA rules with YARA-X
  # (a later engine candidate: rules must stay compatible). helm, promtool
  # and yr are release binaries, pinned by version and sha256.
  rules:
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.26-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af
    env:
      HELM_VERSION: v3.19.0
      HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
      PROMETHEUS_VERSION: 3.4.2
      PROMETHEUS_SHA256: 630177c6ad011193987904f09ffafec29d531abfeb5e43fa3714e376e5f28ddc
      YARA_X_VERSION: v1.22.0
      YARA_X_SHA256: 7f470770b2c1a0d97f02298fc194978d999074d147d003d33dd62775761439db
    steps:
      - name: checkout
        env:
          TOKEN: ${{ gitea.token }}
          REPO: ${{ gitea.server_url }}/${{ gitea.repository }}.git
          SHA: ${{ gitea.sha }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth=1 "$REPO" "$SHA"
          git checkout -q FETCH_HEAD
      - name: helm and promtool
        run: |
          set -eu
          mkdir -p /tmp/tools && cd /tmp/tools
          # A stalled download would otherwise hang until the job times out.
          get() { curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 --retry-all-errors -o "$@"; }
          get helm.tgz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          get prometheus.tgz "https://github.com/prometheus/prometheus/releases/download/v$PROMETHEUS_VERSION/prometheus-$PROMETHEUS_VERSION.linux-amd64.tar.gz"
          echo "$PROMETHEUS_SHA256  prometheus.tgz" | sha256sum -c -
          tar -xzf prometheus.tgz --strip-components=1 "prometheus-$PROMETHEUS_VERSION.linux-amd64/promtool"
          get yara-x.tgz "https://github.com/VirusTotal/yara-x/releases/download/$YARA_X_VERSION/yara-x-$YARA_X_VERSION-x86_64-unknown-linux-gnu.tar.gz"
          echo "$YARA_X_SHA256  yara-x.tgz" | sha256sum -c -
          mkdir yara-x && tar -xzf yara-x.tgz -C yara-x
          mv "$(find yara-x -type f -name yr)" yr
      - run: PATH="/tmp/tools:$PATH" make test-rules
      - run: hack/yara/check-yarax.sh /tmp/tools/yr charts/meles/rules/*.yar

  # The YARA rules in the ClamAV image the chart deploys: every rule must
  # load. The image has neither git nor bash, so the code comes as an archive.
  yara:
    runs-on: ubuntu-latest
    container:
      # Keep in line with clamd.image in charts/meles/values.yaml.
      image: docker.io/clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    defaults:
      run:
        shell: sh
    steps:
      - name: checkout
        env:
          TOKEN: ${{ gitea.token }}
          ARCHIVE: ${{ gitea.server_url }}/api/v1/repos/${{ gitea.repository }}/archive/${{ gitea.sha }}.tar.gz
        run: |
          wget -q --header "Authorization: token $TOKEN" -O /tmp/src.tgz "$ARCHIVE"
          tar -xzf /tmp/src.tgz --strip-components=1
      - run: hack/yara/check-clamav.sh charts/meles/rules/*.yar

  # Against the real clamd of the testcluster (with the chart's YARA rules),
  # through meles clamd-proxy.
  # The runner's network policy allows exactly this connection.
  selftest:
    needs: test
    runs-on: ubuntu-latest
    container:
      image: docker.io/library/golang:1.26-bookworm@sha256:632dff7351799a5a9954a48dc06670ade72ee44e8c351cdc0e5a57af2fea21af
    env:
      MELES_CLAMD: tls://meles-clamd.meles.svc.cluster.local:3310
      MELES_CLAMD_TOKEN: ${{ secrets.MELES_CLAMD_TOKEN }}
      MELES_CLAMD_CA: /tmp/clamd-ca.crt
    steps:
      - name: checkout
        env:
          TOKEN: ${{ gitea.token }}
          REPO: ${{ gitea.server_url }}/${{ gitea.repository }}.git
          SHA: ${{ gitea.sha }}
        run: |
          git init -q .
          git -c http.extraHeader="Authorization: token $TOKEN" fetch -q --depth=1 "$REPO" "$SHA"
          git checkout -q FETCH_HEAD
      - name: clamd CA
        env:
          CA: ${{ secrets.MELES_CLAMD_CA }}
        run: printf '%s\n' "$CA" > "$MELES_CLAMD_CA"
      - run: go build -o /tmp/meles ./cmd/meles
      - run: /tmp/meles selftest
      - name: exit codes (infected images fail the pipeline, a clean one passes)
        shell: bash
        run: |
          go run ./hack/testregistry -listen 127.0.0.1:5055 > /tmp/registry.log &
          for i in $(seq 120); do grep -q yara-xmrig-config /tmp/registry.log && break; sleep 1; done
          fail=0
          check() {
            # The job shell runs with -e: catch the expected non-zero codes.
            got=0
            /tmp/meles image --insecure-registry --format json "127.0.0.1:5055/selftest/$1:latest" > /dev/null || got=$?
            echo "$1: exit $got, want $2"
            [ "$got" = "$2" ] || fail=1
          }
          check clean 0
          check eicar-present 1
          check eicar-whiteout 1
          check eicar-opaque 1
          # The chart's default YARA rules in the testcluster's clamd.
          check yara-xmrig-config 1
          exit $fail
      - run: MELES_TEST_YARA=1 make test-integration CLAMD="$MELES_CLAMD"
