name: release
# A tag v* publishes a release: binaries (GoReleaser), the multi-arch image
# (ko) and the Helm chart on ghcr.io, signed with cosign (keyless) and with
# build provenance from GitHub. Started by hand, the workflow builds
# everything as a dry run and publishes nothing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # GitHub release
      packages: write # image and chart on ghcr.io
      id-token: write # keyless signatures and attestations
      attestations: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
      IMAGE: ghcr.io/movray/meles
      CHART_REPO: oci://ghcr.io/movray/charts
      # Go tools are installed with go install: the module proxy and the
      # checksum database verify them. GOTOOLCHAIN=auto lets a tool fetch
      # the newer Go it requires; meles itself is built with the Go above. Keep KO_VERSION in line with the
      # Makefile.
      GORELEASER_VERSION: v2.19.0
      KO_VERSION: v0.18.0
      # Keep in line with the Makefile.
      GOVULNCHECK_VERSION: v1.9.0
      COSIGN_VERSION: v3.1.4
      ORAS_VERSION: v1.3.6
      HELM_VERSION: v3.19.0
      HELM_SHA256: a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496
      TRIVY_VERSION: 0.76.1
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
      # Keep in line with the selftest job in ci.yml.
      CLAMAV_IMAGE: docker.io/clamav/clamav:1.4@sha256:3bba6dd5ac6663d55b80f86a3126e146612d93b593cc2617188d13f637d91260
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from the history.
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # Latest patch release of the Go version in go.mod: go-version-file
          # would pick exactly 1.26.0 and ship its fixed vulnerabilities.
          go-version: "1.26.x"
          check-latest: true
          # No cache in the release job: a poisoned cache would end up in
          # the published artifacts.
          cache: false

      - name: Tools
        run: |
          set -eu
          export GOTOOLCHAIN=auto
          go install "github.com/goreleaser/goreleaser/v2@$GORELEASER_VERSION"
          go install "github.com/google/ko@$KO_VERSION"
          go install "github.com/sigstore/cosign/v3/cmd/cosign@$COSIGN_VERSION"
          go install "golang.org/x/vuln/cmd/govulncheck@$GOVULNCHECK_VERSION"
          go install "oras.land/oras/cmd/oras@$ORAS_VERSION"
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools"
          curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 --retry-all-errors \
            -o helm.tgz "https://get.helm.sh/helm-$HELM_VERSION-linux-amd64.tar.gz"
          echo "$HELM_SHA256  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          curl -fsSL --connect-timeout 20 --max-time 300 --retry 3 --retry-all-errors \
            -o trivy.tgz "https://github.com/aquasecurity/trivy/releases/download/v$TRIVY_VERSION/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "$TRIVY_SHA256  trivy.tgz" | sha256sum -c -
          tar -xzf trivy.tgz trivy
          echo "$RUNNER_TEMP/tools" >> "$GITHUB_PATH"

      # Nothing is published with a known vulnerability in the code paths
      # meles reaches, its dependencies or the Go it is built with.
      - name: govulncheck
        run: govulncheck ./...

      - name: Version
        run: |
          set -eu
          if [ "$PUBLISH" = true ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.0.0-dev.$(git rev-parse --short HEAD)"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "OUT=$RUNNER_TEMP/out" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/out"

      # The section "## vX.Y.Z" of CHANGELOG.md (upgrade notes, security
      # fixes) heads the release notes, above the changelog from the
      # commits. Required for a final release, optional for pre-releases.
      # The dry run uses the topmost section: what the next tag publishes.
      - name: Release notes
        run: |
          set -eu
          h="## v$VERSION"
          [ "$PUBLISH" = true ] || h="$(grep -m1 '^## v' CHANGELOG.md || true)"
          awk -v h="$h" '$0 == h {f = 1; next} /^## / {f = 0} f' CHANGELOG.md > "$OUT/notes.md"
          if [ -s "$OUT/notes.md" ]; then
            echo "NOTES=$OUT/notes.md" >> "$GITHUB_ENV"
            cat "$OUT/notes.md"
          elif [ "$PUBLISH" = true ]; then
            case "$VERSION" in
              *-*) echo "no section v$VERSION in CHANGELOG.md (pre-release, left out)" ;;
              *) echo "CHANGELOG.md has no section ## v$VERSION" >&2; exit 1 ;;
            esac
          fi

      - name: Log in to ghcr.io
        if: env.PUBLISH == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | ko login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      # Nothing is published that fails a scan of meles or Trivy. The image
      # is built into a local OCI layout for this; the step "Image" builds
      # it again and checks that it is the same.
      - name: Scan the image
        run: |
          set -eu
          KO_DOCKER_REPO="$IMAGE" ko build --bare --push=false --oci-layout-path="$OUT/layout" \
            --platform=linux/amd64,linux/arm64 ./cmd/meles
          digest="$(jq -r '.manifests[0].digest' "$OUT/layout/index.json")"
          case "$digest" in
            sha256:*) ;;
            *) echo "no digest in the OCI layout: $digest" >&2; exit 1 ;;
          esac
          echo "SCANNED_DIGEST=$digest" >> "$GITHUB_ENV"
          go build -o "$OUT/meles" ./cmd/meles
          hack/ci/self-scan.sh "$OUT/meles" "$OUT/layout"

      # Image and chart first: the GitHub release names both, so it is only
      # created once they exist.
      - name: Image
        run: |
          set -eu
          tags="$VERSION"
          # Pre-releases (1.0.0-rc.1) do not move latest.
          case "$VERSION" in *-*) ;; *) tags="$tags,latest" ;; esac
          push=false
          [ "$PUBLISH" = true ] && push=true
          # ko prints the reference of the image index on stdout. The file
          # from --image-refs also lists the per-platform manifests, and
          # signing one of those leaves the index unsigned.
          ref="$(KO_DOCKER_REPO="$IMAGE" ko build --bare --push="$push" \
            --platform=linux/amd64,linux/arm64 --tags="$tags" ./cmd/meles)"
          echo "image: $ref"
          case "$ref" in
            *@sha256:*) ;;
            *) echo "no digest in the ko output: $ref" >&2; exit 1 ;;
          esac
          if [ "${ref##*@}" != "$SCANNED_DIGEST" ]; then
            echo "image ${ref##*@} is not the scanned image $SCANNED_DIGEST" >&2
            exit 1
          fi
          echo "IMAGE_DIGEST=${ref##*@}" >> "$GITHUB_ENV"

      - name: Sign image
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "$IMAGE@$IMAGE_DIGEST"
      - name: Image provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Chart
        run: |
          set -eu
          helm lint charts/meles
          helm package charts/meles --version "$VERSION" --app-version "$VERSION" -d "$OUT"
          if [ "$PUBLISH" = true ]; then
            helm push "$OUT/meles-$VERSION.tgz" "$CHART_REPO" 2>&1 | tee "$OUT/helm-push.log"
            digest="$(sed -n 's/^Digest: //p' "$OUT/helm-push.log")"
            [ -n "$digest" ] || { echo "no chart digest in the helm push output" >&2; exit 1; }
            echo "CHART_DIGEST=$digest" >> "$GITHUB_ENV"
          fi

      - name: Sign chart
        if: env.PUBLISH == 'true'
        run: cosign sign --yes "${CHART_REPO#oci://}/meles@$CHART_DIGEST"
      - name: Chart provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/movray/charts/meles
          subject-digest: ${{ env.CHART_DIGEST }}
          push-to-registry: true

      # Repository metadata for Artifact Hub (Verified Publisher), with
      # every release so that it follows the file in the repository.
      - name: Artifact Hub metadata
        if: env.PUBLISH == 'true'
        working-directory: charts
        run: |
          oras push "${CHART_REPO#oci://}/meles:artifacthub.io" \
            --config /dev/null:application/vnd.cncf.artifacthub.config.v1+yaml \
            artifacthub-repo.yml:application/vnd.cncf.artifacthub.repository-metadata.layer.v1.yaml

      - name: Binaries and GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          header=""
          [ -n "${NOTES:-}" ] && header="--release-header=$NOTES"
          if [ "$PUBLISH" = true ]; then
            goreleaser release --clean $header
          else
            goreleaser release --snapshot --clean $header
          fi

      - name: Binary provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
