name: vuln
# govulncheck: known vulnerabilities in the code paths meles reaches. Weekly
# as well, because new advisories appear without a change to meles; the
# release workflow runs it again before it publishes.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          # The Go a release is built with (release.yml): the latest patch
          # release, so that the standard library is checked as shipped.
          go-version: "1.26.x"
          check-latest: true
      - run: make vuln
