name: scorecard
# OpenSSF Scorecard: checks the repository's security practices (pinned
# dependencies, branch protection, token permissions, ...). The results go
# to the Security tab and to the public API behind the badge in the README.
on:
  push:
    branches: [main]
  schedule:
    - cron: "33 5 * * 1"
  # The Branch-Protection check reads the branch protection rules.
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # results in the Security tab
      id-token: write # publish the results for the badge
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
