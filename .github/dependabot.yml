# Weekly, grouped, so that updates come as a few pull requests. Security
# updates come as soon as an advisory is published, independent of this
# schedule. spike/ is a throwaway prototype and is left out.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      kubernetes:
        patterns: ["k8s.io/*", "sigs.k8s.io/*"]
      go-dependencies:
        patterns: ["*"]
        exclude-patterns: ["k8s.io/*", "sigs.k8s.io/*"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A nested module with its own tags (pkg/authn/kubernetes/vX);
      # Dependabot looks for the root module's tags and fails. Update it by
      # hand together with go-containerregistry.
      - dependency-name: github.com/google/go-containerregistry/pkg/authn/kubernetes

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
