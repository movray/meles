# Default values for meles.

nameOverride: ""
fullnameOverride: ""

image:
  repository: git.itknecht.de/sugras/meles
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Pull secrets for the meles image, e.g. [{name: meles-pull}].
imagePullSecrets: []

# Shared by the server, the selftest and the clamd configuration.
scan:
  # Larger files are skipped and reported. clamd's StreamMaxLength and
  # MaxFileSize are set to the same value, MaxScanSize to at least it.
  # At most 2047M: ClamAV cannot scan larger files. Files above 4 MiB are
  # streamed to clamd, so a higher value costs no memory in meles; clamd
  # keeps each stream in a temporary file in the container while it scans
  # it (up to maxThreads x maxFileSize of ephemeral storage).
  maxFileSize: 768M
  # Mirrors the server and the operator pull from first, e.g. a Harbor
  # proxy cache project per upstream registry; the registry itself is the
  # fallback (as in containerd). Mirrors are trusted for tags, digests are
  # verified. Registries that are only other names for Docker Hub (e.g.
  # cr.smallstep.com) need their own entry with the same prefix.
  #   - docker.io=harbor.example.com/dockerhub
  #   - quay.io=harbor.example.com/quay
  registryMirrors: []
  # Additional CA certificates for registries and mirrors (PEM), e.g. a
  # private CA that signed Harbor's certificate; the system roots stay.
  registryCA:
    configMap: ""
    key: ca.crt

server:
  enabled: true
  # Time zone for cron schedules.
  timezone: UTC
  # Runs executed in parallel.
  workers: 1
  # Parallel clamd sessions per run.
  concurrency: 4
  # Secret of type kubernetes.io/dockerconfigjson with credentials for
  # private registries to scan (optional).
  registryAuthSecret: ""
  # Additional environment variables, e.g. MELES_CACHE_PATHS.
  extraEnv: []
  # Page "Cluster": the MalwareReports of the operator, read from the
  # Kubernetes API (ClusterRole with get/list/watch on malwarereports).
  clusterReports:
    # null: on together with operator.enabled. true needs the CRD installed.
    enabled: null
    # "Rescan" button: sets the meles.io/rescan annotation (adds patch).
    rescan: true
    # Every change of a report is recorded in the server's database; events
    # older than this are deleted (the last one of each report is kept).
    historyDays: 365
  persistence:
    # SQLite database (WAL mode); the server therefore runs with exactly one
    # replica. Use a local or block storage class, not NFS: SQLite's WAL
    # does not work reliably on network file systems.
    size: 1Gi
    storageClass: ""
    existingClaim: ""
  service:
    port: 80
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    # Buffers up to (concurrency+1) x 4 MiB per scan plus the layer cache.
    limits: {memory: 1Gi}
  # meles has no login of its own. oauth2-proxy runs as a sidecar in front
  # of the UI: only users logged in with the OIDC provider (Keycloak,
  # GitHub, Entra ID, ...) get through. The server then listens on
  # 127.0.0.1 only, so the login cannot be bypassed inside the cluster.
  oauth2Proxy:
    enabled: false
    image:
      repository: quay.io/oauth2-proxy/oauth2-proxy
      tag: v7.15.5
      pullPolicy: IfNotPresent
    # OIDC issuer, e.g. https://keycloak.example.com/realms/main
    issuerUrl: ""
    clientId: meles
    # Secret with the key "client-secret" (required). The cookie secret is
    # generated by the chart and kept on upgrades.
    existingSecret: ""
    # e.g. https://meles.example.com/oauth2/callback; empty: derived from
    # the request.
    redirectUrl: ""
    # Restrict access, e.g. [meles-admins]; needs a groups claim. Empty: any
    # user of the provider who passes emailDomains.
    allowedGroups: []
    emailDomains: ["*"]
    # CA certificate (PEM) of the provider, e.g. an internal CA: a ConfigMap
    # in the release namespace. The system roots stay trusted.
    providerCA:
      configMap: ""
      key: ca.crt
    # false only for tests without HTTPS: the session cookie is then sent
    # unencrypted.
    cookieSecure: true
    # Further oauth2-proxy flags, e.g. [--scope=openid email profile groups].
    extraArgs: []
    resources:
      requests: {cpu: 10m, memory: 32Mi}
      limits: {memory: 128Mi}
  httpRoute:
    enabled: false
    # e.g. [{name: gateway, namespace: gateway-system}]
    parentRefs: []
    hostnames: []
  ingress:
    enabled: false
    className: ""
    host: ""
    annotations: {}
    # e.g. [{secretName: meles-tls, hosts: [meles.example.com]}]
    tls: []
  nodeSelector: {}
  tolerations: []
  affinity: {}

clamd:
  enabled: true
  # clamd address if clamd.enabled is false, e.g. tcp://clamd.other:3310.
  address: ""
  image:
    repository: clamav/clamav
    tag: "1.4"
    pullPolicy: IfNotPresent
  replicas: 1
  # Data scanned per file including unpacked content (archives, packed
  # binaries); raised to scan.maxFileSize if lower. Also clamd's
  # MaxFileSize, which applies to unpacked content (meles limits the files
  # themselves with scan.maxFileSize). Files beyond it are skipped
  # (Heuristics.Limits.Exceeded.MaxScanSize or .MaxFileSize).
  maxScanSize: 100M
  # Maximum scan time per file in milliseconds (clamd default 120000). The
  # meles clients wait this long plus a minute (at least 5 minutes).
  # Large compressed archives such as php.tar.xz can need more; files beyond
  # it are skipped (Heuristics.Limits.Exceeded.MaxScanTime).
  maxScanTime: 120000
  # Maximum number of files scanned in an archive (clamd default 10000).
  # Source tarballs can have more (e.g. php.tar.xz in the Nextcloud image);
  # beyond it the archive is skipped (Heuristics.Limits.Exceeded.MaxFiles).
  maxFiles: 10000
  # Maximum nesting of archives (clamd default 17). Source tarballs can nest
  # deeper (php.tar.xz in the Nextcloud image); beyond it the file is
  # skipped (Heuristics.Limits.Exceeded.MaxRecursion).
  maxRecursion: 17
  maxThreads: 12
  # clamd has no authentication of its own. With auth enabled, clamd listens
  # only on 127.0.0.1 and the sidecar "meles clamd-proxy" accepts clients
  # with TLS and a token, forwarding only PING, VERSION, IDSESSION, INSTREAM
  # and END (no SHUTDOWN, no SCAN <path>). Server and selftest of this
  # release are configured automatically. Other clients use
  #   --clamd tls://<release>-clamd.<namespace>:3310
  #   MELES_CLAMD_TOKEN=<token from the token secret>
  #   --clamd-ca <ca.crt from the TLS secret>
  auth:
    enabled: true
    # Secret with the key "token" (several tokens, one per line, allow a
    # rotation). Empty: the chart generates a token and keeps it on upgrades.
    existingSecret: ""
    tls:
      # Secret with tls.crt, tls.key and ca.crt. Empty: cert-manager (below)
      # or a self-signed CA generated by the chart and kept on upgrades.
      existingSecret: ""
      certManager:
        enabled: false
        # The issuer must put ca.crt into the secret (CA or self-signed
        # issuer); clients use it to verify the proxy.
        issuerRef: {}
        #  name: internal-ca
        #  kind: ClusterIssuer
      # Further DNS names of the certificate, e.g. for access from outside.
      extraDnsNames: []
    proxy:
      maxConnections: 100
      resources:
        requests: {cpu: 10m, memory: 32Mi}
        limits: {memory: 128Mi}
  # Appended to clamd.conf.
  extraConfig: ""
  freshclam:
    # Database mirror for freshclam if mirror.enabled is false. Empty means
    # Cisco Talos directly - mind their rate limits.
    privateMirror: ""
    checksPerDay: 24
  resources:
    requests: {cpu: 100m, memory: 1536Mi}
    # A database reload briefly needs almost twice the memory.
    limits: {memory: 3Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# The only component that talks to Cisco Talos: cvdupdate fetches the ClamAV
# databases once per hour, nginx serves them to freshclam in the clamd pods.
mirror:
  enabled: true
  cvdupdate:
    image:
      repository: python
      tag: 3.12-slim
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 10m, memory: 64Mi}
      limits: {memory: 256Mi}
  nginx:
    image:
      repository: nginxinc/nginx-unprivileged
      tag: 1.27-alpine
      pullPolicy: IfNotPresent
    resources:
      requests: {cpu: 10m, memory: 16Mi}
      limits: {memory: 64Mi}
  persistence:
    size: 2Gi
    storageClass: ""
    existingClaim: ""
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Checks the whole chain: EICAR test images from an in-memory registry,
# scanned by clamd. Run it manually with
#   kubectl create job --from=cronjob/<release>-selftest selftest-$(date +%s)
selftest:
  enabled: true
  schedule: "0 6 * * *"
  suspend: true
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {memory: 256Mi}

# Scans the image of every pod in the cluster and writes MalwareReports
# (meles.io/v1alpha1), one per workload and container, in the pod's
# namespace:  kubectl get malwarereports -A
# The CRD is in the chart's crds/ directory: helm installs it once and never
# deletes it; apply it again after upgrades:
#   kubectl apply -f charts/meles/crds/
operator:
  enabled: false
  # nodes: the architectures of the cluster's nodes; all; or a list such as
  # linux/amd64,linux/arm64.
  platform: nodes
  # Images scanned in parallel. Pods are reconciled apart from that, so a
  # long scan does not hold up new pods, deleted reports or rescans.
  workers: 2
  # Parallel clamd sessions per scan.
  concurrency: 4
  # Wait before retrying an image whose scan failed (pull or engine error).
  retryAfter: 1h
  # Wait before rescanning an image with skipped files. Usually clamd's
  # limits (clamd.maxScanSize, clamd.maxScanTime) are the cause; a retry
  # only helps once they were raised and scans the large files again.
  retryIncompleteAfter: 12h
  # Rescan images when the signature database changed, at most this often
  # per image (each rescan pulls the image again); 0 disables.
  rescanInterval: 24h
  # Private images are pulled with the imagePullSecrets of the pods that run
  # them and of their service accounts, where the operator may read them:
  # per namespace, a RoleBinding to the ClusterRole <release>-pull-secret-
  # reader (the error of a refused pull names the command). clusterWide
  # binds it in all namespaces: get on every secret of the cluster.
  # Without access, private images are reported as Error, never as Clean.
  pullSecrets:
    clusterWide: false
  # Secret of type kubernetes.io/dockerconfigjson the operator always uses,
  # e.g. one Docker Hub account against its rate limit, or a mirror; needs
  # no permission on other secrets.
  registryAuthSecret: ""
  # Delete reports of ReplicaSets, StatefulSets and DaemonSets without pods
  # (e.g. old ReplicaSets of a Deployment) this often; 0 disables.
  pruneInterval: 30m
  # Scan gate: hold new pods until their images are scanned. Off by default:
  # the operator then only reports and has no permission to change pods.
  # Turned on, a mutating webhook adds a scheduling gate to new pods in
  # namespaces labelled meles.io/gate=enforce (released once every image is
  # Clean) or meles.io/gate=audit (held only if an image is Infected); the
  # operator scans, pins the pods to the scanned digests and releases them.
  # It gets patch on pods and creates events in all namespaces. A workload
  # opts out with the annotation meles.io/gate: skip on its pod template.
  # kube-system and the release namespace are never gated. Needs Kubernetes
  # 1.30 or later.
  gate:
    enabled: false
    # Release held pods also when the scan failed in clamd (an outage of
    # meles), with a warning event. false: they wait until clamd is back.
    failOpen: true
    # Webhook failurePolicy: Ignore starts pods ungated while the operator
    # is down (fail-open); Fail refuses to create pods in gated namespaces
    # until it is back.
    failurePolicy: Ignore
    timeoutSeconds: 5
    # Operator replicas while the gate is on: the webhook runs in every
    # replica (only the leader scans), so that pods are gated during a
    # rollout of the operator, too. Each replica caches all pods.
    replicas: 2
    # Further namespaces that are never gated.
    excludeNamespaces: []
    # Certificate of the webhook: self-signed (generated once and kept) or
    # from cert-manager (the CA injector fills the caBundle; the issuer must
    # provide ca.crt, e.g. a CA issuer).
    tls:
      certManager:
        enabled: false
        issuerRef: {}
  # The operator serves /metrics (Prometheus) and /status (its queue,
  # running scans and held pods, shown by the server) on port 8080, behind
  # the headless service <release>-operator-metrics. A ServiceMonitor for
  # the Prometheus operator:
  serviceMonitor:
    enabled: false
    interval: 30s
    # Labels your Prometheus selects ServiceMonitors by, e.g. release: kube-prometheus-stack.
    labels: {}
  # A Grafana dashboard of these metrics as a ConfigMap, for Grafana's
  # dashboard sidecar (kube-prometheus-stack: label grafana_dashboard: "1",
  # any namespace by default). The JSON is in the chart under dashboards/
  # for importing it by hand.
  grafanaDashboard:
    enabled: false
    # Namespace of the ConfigMap, if the sidecar watches only Grafana's.
    namespace: ""
    labels:
      grafana_dashboard: "1"
    # e.g. grafana_folder: meles (with the sidecar's folderAnnotation)
    annotations: {}
  # Alerts as a PrometheusRule (Prometheus operator): Infected reports
  # (critical), reports in Error and Incomplete, operator down or without a
  # leader, a stuck scan queue and, with the scan gate, held pods and pods
  # released without a complete scan. Needs the metrics in Prometheus
  # (serviceMonitor and networkPolicy.operatorMetricsFrom).
  prometheusRule:
    enabled: false
    # Labels your Prometheus selects rules by, e.g. release: kube-prometheus-stack.
    labels: {}
    # Labels added to every alert, e.g. team: platform, for Alertmanager's routes.
    alertLabels: {}
    # Alerts to leave out, e.g. {MelesScansIncomplete: true}.
    disabled: {}
    # How long reports stay Error or Incomplete before they alert; the
    # operator retries failed scans meanwhile (retryAfter).
    errorFor: 6h
    # How long the scan gate holds pods before it alerts.
    gateHeldFor: 30m
    # URL of meles server for the alerts' url annotation (the report or the
    # Cluster page); default from server.ingress or server.httpRoute.
    uiURL: ""
  # Additional environment variables, e.g. MELES_LOG_LEVEL=debug.
  extraEnv: []
  resources:
    requests: {cpu: 50m, memory: 256Mi}
    # The informer cache holds all pods and jobs of the cluster, plus up to
    # (workers x (concurrency+1)) x 4 MiB of file buffers and the layer cache.
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

# Harbor's pluggable scanner adapter: Harbor scans every pushed image with
# meles. Register it in Harbor (Administration, Interrogation Services) with
# the URL http://<release>-harbor-adapter.<namespace>:8080, Authorization
# "Bearer" and the token from the secret <release>-harbor-adapter-token.
harborAdapter:
  enabled: false
  # Images scanned in parallel, and clamd sessions per scan.
  workers: 2
  concurrency: 4
  auth:
    # Secret with the key "token"; empty: generated and kept.
    existingSecret: ""
  # Namespace of Harbor. Harbor sends its registry as a short service name
  # (http://harbor-core:80); the adapter completes it to harbor-core.<ns>.
  harborNamespace: harbor
  # Harbor severity of files that were not scanned. Critical (default):
  # an unscanned file does not pass a "prevent vulnerable images" gate.
  skippedSeverity: Critical
  # A Harbor project uses one scanner. Chain another adapter to keep its
  # CVE scan, e.g. Harbor's Trivy: http://harbor-trivy.harbor:8080. Reports
  # then contain both; SBOM requests are passed through.
  upstream:
    url: ""
    # Secret with the key "token", if the upstream wants a bearer token.
    tokenSecret: ""
  # Ignore rules (format of meles image --ignorefile); ignored entries are
  # left out of Harbor's reports.
  ignoreRules: []
  service:
    port: 8080
  extraEnv: []
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    # (workers x (concurrency+1)) x 4 MiB of file buffers plus the layer
    # cache.
    limits: {memory: 1Gi}
  nodeSelector: {}
  tolerations: []
  affinity: {}

networkPolicy:
  # clamd has no authentication. Only pods of this release may connect to
  # it, only clamd may fetch from the mirror. Egress is not restricted.
  enabled: true
  # Additional NetworkPolicyPeers allowed to reach clamd on 3310, e.g. CI
  # runners in another namespace:
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: gitea-runner}
  clamdExtraFrom: []
  # NetworkPolicyPeers allowed to reach the server, e.g. the ingress
  # controller. Empty: no restriction.
  serverFrom: []
  # NetworkPolicyPeers allowed to scrape the operator's /metrics and /status
  # (port 8080) besides the server, e.g. Prometheus:
  #   - namespaceSelector:
  #       matchLabels: {kubernetes.io/metadata.name: monitoring}
  operatorMetricsFrom: []
