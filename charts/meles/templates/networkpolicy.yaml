{{- if .Values.networkPolicy.enabled }}
{{- $fullname := include "meles.fullname" . }}
{{- if .Values.clamd.enabled }}
# clamd has no authentication: only pods of this release (server, selftest)
# and clamdExtraFrom may connect.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-clamd
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamd
spec:
  podSelector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clamd
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "meles.selectorLabels" . | nindent 14 }}
        {{- with .Values.networkPolicy.clamdExtraFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: {{ include "meles.clamdPodPort" . }}}
{{- end }}
{{- if and .Values.mirror.enabled .Values.clamd.enabled }}
---
# Only freshclam in the clamd pods fetches from the mirror.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-mirror
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
spec:
  podSelector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mirror
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "meles.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: clamd
      ports:
        - {protocol: TCP, port: 8080}
{{- end }}
{{- if and .Values.server.enabled .Values.networkPolicy.serverFrom }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  podSelector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.serverFrom | nindent 8 }}
      ports:
        - {protocol: TCP, port: {{ include "meles.serverPodPort" . }}}
{{- end }}
{{- if .Values.operator.enabled }}
---
# The operator's /status names images, namespaces and pods: port 8080 only
# for the server and operatorMetricsFrom. Health probes and the scan gate's
# webhook (called by the API server, which no selector matches) stay open.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  podSelector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "meles.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: server
        {{- with .Values.networkPolicy.operatorMetricsFrom }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - {protocol: TCP, port: 8080}
    - ports:
        - {protocol: TCP, port: 8081}
        - {protocol: TCP, port: 9443}
{{- end }}
{{- end }}
