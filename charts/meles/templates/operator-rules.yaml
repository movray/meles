{{- if and .Values.operator.enabled .Values.operator.prometheusRule.enabled }}
{{- $fullname := include "meles.fullname" . }}
{{- $v := .Values.operator.prometheusRule }}
{{- /* job is the metrics service's name; the namespace label of
meles_operator_reports is the report's (honorLabels), so it selects by job. */}}
{{- $job := printf "job=\"%s-operator-metrics\"" $fullname }}
{{- $ui := include "meles.uiURL" . }}
{{- $rules := list }}
{{- $rules = append $rules (dict
  "alert" "MelesInfectedWorkload"
  "expr" (printf "max by (namespace, report, workload_kind, workload, container, image) (meles_operator_infected{%s}) > 0" $job)
  "for" "0m" "severity" "critical"
  "summary" "Malware found in {{ $labels.workload_kind }} {{ $labels.namespace }}/{{ $labels.workload }}."
  "description" "Container {{ $labels.container }} of {{ $labels.workload_kind }} {{ $labels.namespace }}/{{ $labels.workload }} runs {{ $labels.image }}, findings: {{ $value }}. Details: kubectl -n {{ $labels.namespace }} get malwarereport {{ $labels.report }} -o yaml. A false positive belongs in a MalwareIgnore with a reason."
  "path" "/cluster/{{ $labels.namespace }}/{{ $labels.report }}") }}
{{- $rules = append $rules (dict
  "alert" "MelesScanErrors"
  "expr" (printf "sum by (namespace) (meles_operator_reports{%s,status=\"Error\"}) > 0" $job)
  "for" $v.errorFor "severity" "warning"
  "summary" "Images in {{ $labels.namespace }} could not be scanned."
  "description" "MalwareReports in Error in {{ $labels.namespace }}: {{ $value }}, for longer than the operator's retries, so those images are not scanned. The report's error names the cause, e.g. a refused pull."
  "path" "/cluster?namespace={{ $labels.namespace }}&status=error") }}
{{- $rules = append $rules (dict
  "alert" "MelesScansIncomplete"
  "expr" (printf "sum by (namespace) (meles_operator_reports{%s,status=\"Incomplete\"}) > 0" $job)
  "for" $v.errorFor "severity" "info"
  "summary" "Images in {{ $labels.namespace }} were scanned with skipped files."
  "description" "Incomplete MalwareReports in {{ $labels.namespace }}: {{ $value }}. Files were skipped, usually over clamd's size limits; skipped files are not scanned."
  "path" "/cluster?namespace={{ $labels.namespace }}&status=incomplete") }}
{{- $rules = append $rules (dict
  "alert" "MelesOperatorDown"
  "expr" (printf "sum(up{%s}) == 0 or absent(up{%s})" $job $job)
  "for" "10m" "severity" (ternary "critical" "warning" .Values.operator.gate.enabled)
  "summary" "No meles operator replica is reachable."
  "description" "Prometheus reaches no replica of the meles operator: new images are not scanned, and with the scan gate new pods in gated namespaces are admitted ungated (fail-open) or held.") }}
{{- $rules = append $rules (dict
  "alert" "MelesOperatorNoLeader"
  "expr" (printf "max(meles_operator_leader{%s}) < 1" $job)
  "for" "10m" "severity" "warning"
  "summary" "No meles operator replica is the leader."
  "description" "The operator runs, but no replica holds the leader lease, so nothing is scanned."
  "path" "/cluster") }}
{{- $rules = append $rules (dict
  "alert" "MelesScanQueueStuck"
  "expr" (printf "sum(meles_operator_scan_queue{%s}) > 0 and (sum(increase(meles_operator_scans_total{%s}[30m])) or vector(0)) == 0" $job $job)
  "for" "15m" "severity" "warning"
  "summary" "Image scans wait, but none finished for 30 minutes."
  "description" "Queued scans: {{ $value }}, and no scan finished within 30 minutes. Check clamd and the operator's log."
  "path" "/cluster") }}
{{- if .Values.operator.gate.enabled }}
{{- $rules = append $rules (dict
  "alert" "MelesGatePodsHeld"
  "expr" (printf "sum(meles_operator_gate_held_pods{%s}) > 0" $job)
  "for" $v.gateHeldFor "severity" "warning"
  "summary" "The meles scan gate holds pods."
  "description" "Pods held by the scan gate: {{ $value }} (for at least as long as this alert waited). An image is Infected, cannot be resolved or pulled, or (enforce) was scanned incompletely. The Cluster page of meles server and the ScanGateHeld events name the reasons."
  "path" "/cluster") }}
{{- $rules = append $rules (dict
  "alert" "MelesGateReleasedUnscanned"
  "expr" (printf "sum(increase(meles_operator_gate_released_total{%s,scan=\"unscanned\"}[15m])) > 0" $job)
  "for" "0m" "severity" "warning"
  "summary" "The meles scan gate released pods without a complete scan."
  "description" "The scan gate released pods without a complete scan (an outage of clamd with failOpen, or audit mode). The ScanGateReleasedUnscanned events name the pods."
  "path" "/cluster") }}
{{- end }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
    {{- with $v.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: meles-operator
      rules:
        {{- range $rules }}
        {{- if not (get ($v.disabled | default dict) .alert) }}
        - alert: {{ .alert }}
          expr: {{ .expr | quote }}
          for: {{ .for }}
          labels:
            severity: {{ .severity }}
            {{- with $v.alertLabels }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          annotations:
            summary: {{ .summary | quote }}
            description: {{ .description | quote }}
            {{- if and $ui .path }}
            url: {{ printf "%s%s" $ui .path | quote }}
            {{- end }}
        {{- end }}
        {{- end }}
{{- end }}
