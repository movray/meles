{{- if and .Values.server.enabled .Values.server.oauth2Proxy.enabled }}
{{- $name := printf "%s-oauth2-proxy" (include "meles.fullname" .) }}
{{- $cookie := randAlphaNum 32 | b64enc }}
{{- with lookup "v1" "Secret" .Release.Namespace $name }}
{{- with .data }}{{ with index . "cookie-secret" }}{{ $cookie = . }}{{ end }}{{ end }}
{{- end }}
# Encrypts the oauth2-proxy session cookie; generated once and kept on
# upgrades so that sessions survive.
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
type: Opaque
data:
  cookie-secret: {{ $cookie }}
{{- end }}
