{{- if .Values.clamd.enabled }}
{{- $fullname := include "meles.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-clamd
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamd
spec:
  replicas: {{ .Values.clamd.replicas }}
  selector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: clamd
  template:
    metadata:
      labels:
        {{- include "meles.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: clamd
      annotations:
        # Only the data: a new chart version alone must not restart clamd.
        checksum/config: {{ (include (print $.Template.BasePath "/clamd-config.yaml") . | fromYaml).data | toYaml | sha256sum }}
    spec:
      {{- if include "meles.clamdAuth" . }}
      {{- include "meles.imagePullSecrets" . | nindent 6 }}
      {{- end }}
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      {{- include "meles.scheduling" .Values.clamd | nindent 6 }}
      {{- if .Values.mirror.enabled }}
      # freshclam exits, and with it the clamd container, if the mirror has
      # no databases yet (first install, mirror restarting).
      initContainers:
        - name: wait-for-mirror
          image: "{{ .Values.clamd.image.repository }}:{{ .Values.clamd.image.tag }}"
          imagePullPolicy: {{ .Values.clamd.image.pullPolicy }}
          command:
            - sh
            - -c
            - |
              for f in main.cvd daily.cvd bytecode.cvd; do
                until wget -q --spider "http://{{ $fullname }}-mirror/$f"; do
                  echo "waiting for $f on the mirror"; sleep 10
                done
              done
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 32Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
      {{- end }}
      containers:
        - name: clamd
          image: "{{ .Values.clamd.image.repository }}:{{ .Values.clamd.image.tag }}"
          imagePullPolicy: {{ .Values.clamd.image.pullPolicy }}
          env:
            - {name: CLAMAV_NO_MILTERD, value: "true"}
          {{- if not (include "meles.clamdAuth" .) }}
          ports:
            - {name: clamd, containerPort: 3310}
          {{- end }}
          # clamd accepts connections only once the database is loaded.
          # clamdcheck.sh pings "localhost", which may resolve to ::1 while
          # clamd listens on 127.0.0.1 only with auth.
          {{- $check := `["clamdcheck.sh"]` }}
          {{- if include "meles.clamdAuth" . }}
          {{- $check = `["sh", "-c", "printf 'zPING\\0' | nc 127.0.0.1 3310 | grep -q PONG"]` }}
          {{- end }}
          startupProbe:
            exec: {command: {{ $check }}}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec: {command: {{ $check }}}
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: {{ $check }}}
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.clamd.resources | nindent 12 }}
          # The image's entrypoint starts as root and drops to the clamav user.
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: config, mountPath: /etc/clamav/clamd.conf, subPath: clamd.conf}
            - {name: config, mountPath: /etc/clamav/freshclam.conf, subPath: freshclam.conf}
            - {name: db, mountPath: /var/lib/clamav}
        {{- if include "meles.clamdAuth" . }}
        - name: proxy
          image: {{ include "meles.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [clamd-proxy]
          env:
            - {name: MELES_LISTEN, value: ":3311"}
            - {name: MELES_UPSTREAM, value: "tcp://127.0.0.1:3310"}
            - {name: MELES_TLS_CERT, value: /tls/tls.crt}
            - {name: MELES_TLS_KEY, value: /tls/tls.key}
            - {name: MELES_TOKEN_FILE, value: /token/token}
            - {name: MELES_MAX_CONNECTIONS, value: {{ .Values.clamd.auth.proxy.maxConnections | quote }}}
          ports:
            - {name: clamd-tls, containerPort: 3311}
          readinessProbe:
            tcpSocket: {port: clamd-tls}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.clamd.auth.proxy.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tls, mountPath: /tls, readOnly: true}
            - {name: token, mountPath: /token, readOnly: true}
        {{- end }}
      volumes:
        - name: config
          configMap: {name: {{ $fullname }}-clamd}
        - name: db
          emptyDir: {}
        {{- if include "meles.clamdAuth" . }}
        - name: tls
          secret:
            secretName: {{ include "meles.clamdTLSSecret" . }}
            # Readable for the proxy (fsGroup is not set: clamd starts as root).
            defaultMode: 0444
            items:
              - {key: tls.crt, path: tls.crt}
              - {key: tls.key, path: tls.key}
        - name: token
          secret:
            secretName: {{ include "meles.clamdTokenSecret" . }}
            defaultMode: 0444
            items:
              - {key: token, path: token}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-clamd
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamd
spec:
  selector:
    {{- include "meles.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: clamd
  ports:
    - name: clamd
      port: 3310
      targetPort: {{ if include "meles.clamdAuth" . }}clamd-tls{{ else }}clamd{{ end }}
{{- end }}
