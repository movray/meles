{{- if .Values.mirror.enabled }}
{{- $fullname := include "meles.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-mirror
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      access_log off;
      server {
        listen 8080;
        root /mirror/db;
        autoindex off;
        location = /healthz { return 200 "ok\n"; }
        # YARA rules from the ConfigMaps (yara.*).
        location /rules/ { alias /rules/; }
        location / { try_files $uri =404; }
      }
    }
  update.sh: |
    #!/bin/sh
    set -eu
    export HOME=/tmp PATH="/tmp/.local/bin:$PATH"
    pip install --quiet --user --no-cache-dir "cvdupdate>=1.1,<2"
    cvd config set --dbdir /mirror/db --logdir /tmp/cvd-logs
    while true; do
      cvd update || echo "cvd update failed, retrying in an hour" >&2
      sleep 3600
    done
{{- end }}
