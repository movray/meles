{{- if .Values.mirror.enabled }}
{{- $fullname := include "meles.fullname" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-mirror
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
data:
  update.sh: |
    #!/bin/sh
    set -eu
    export HOME=/tmp PATH="/tmp/.local/bin:$PATH"
    pip install --quiet --user --no-cache-dir --require-hashes --no-deps --only-binary :all: -r /scripts/requirements.txt
    # Config and state (cvdupdate's UUID in the User-Agent, the database
    # versions and the cool-down after an HTTP 429) live on the volume, so
    # that they survive a restart. The HTTP server serves only /mirror/db.
    cfg=/mirror/.cvdupdate/config.json
    mkdir -p /mirror/.cvdupdate
    cvd config set --config "$cfg" --dbdir /mirror/db --logdir /tmp/cvd-logs
    while true; do
      cvd update --config "$cfg" || echo "cvd update failed, retrying in an hour" >&2
      sleep 3600
    done
  requirements.txt: |
    {{- .Files.Get "files/mirror/requirements.txt" | nindent 4 }}
{{- end }}
