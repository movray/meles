{{- if .Values.mirror.enabled }}
{{- $fullname := include "meles.fullname" . }}
{{- $yaraFiles := include "meles.yaraFiles" . | trim }}
{{- if not .Values.mirror.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-mirror
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
  annotations:
    # Keep the databases on uninstall: re-downloading counts against the
    # Cisco Talos rate limits.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.mirror.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.mirror.persistence.size }}
{{- end }}
---
# cvdupdate and the HTTP server (meles mirror) share one RWO volume, so
# they run in one pod.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-mirror
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mirror
  template:
    metadata:
      labels:
        {{- include "meles.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: mirror
    spec:
      {{- include "meles.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      {{- include "meles.scheduling" .Values.mirror | nindent 6 }}
      containers:
        - name: cvdupdate
          {{- with .Values.mirror.cvdupdate.image }}
          image: "{{ .repository }}:{{ .tag | default $.Chart.AppVersion }}{{ with .digest }}@{{ . }}{{ end }}"
          imagePullPolicy: {{ .pullPolicy }}
          {{- end }}
          resources:
            {{- toYaml .Values.mirror.cvdupdate.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: db, mountPath: /mirror}
            - {name: tmp, mountPath: /tmp}
        - name: http
          image: {{ include "meles.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [mirror]
          env:
            - {name: MELES_LISTEN, value: ":8080"}
            - {name: MELES_DB_DIR, value: /mirror/db}
            {{- if $yaraFiles }}
            - {name: MELES_RULES_DIR, value: /rules}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            {{- toYaml .Values.mirror.http.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: db, mountPath: /mirror, readOnly: true}
            {{- if $yaraFiles }}
            - {name: rules, mountPath: /rules, readOnly: true}
            {{- end }}
      volumes:
        - name: db
          persistentVolumeClaim:
            claimName: {{ .Values.mirror.persistence.existingClaim | default (printf "%s-mirror" $fullname) }}
        - name: tmp
          emptyDir: {}
        {{- if $yaraFiles }}
        # Not a subPath mount: ConfigMap updates are served without a restart.
        - name: rules
          projected:
            sources:
              {{- if .Values.yara.defaultRules }}
              - configMap:
                  name: {{ $fullname }}-yara
              {{- end }}
              {{- range .Values.yara.extra }}
              - configMap:
                  name: {{ .configMap }}
                  items:
                    {{- range .files }}
                    - {key: {{ . | quote }}, path: {{ . | quote }}}
                    {{- end }}
              {{- end }}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-mirror
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
spec:
  selector:
    {{- include "meles.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mirror
  ports:
    - {name: http, port: 80, targetPort: http}
{{- end }}
