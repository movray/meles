{{- if .Values.operator.enabled }}
{{- $fullname := include "meles.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
---
# Read pods (and the jobs and nodes behind them) in all namespaces, write
# MalwareReports. No access to secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [meles.io]
    resources: [malwarereports]
    verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-operator
    namespace: {{ .Release.Namespace }}
---
# Leader election in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-operator-leader
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-operator-leader
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-operator-leader
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "meles.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ $fullname }}-operator
      {{- include "meles.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- include "meles.scheduling" .Values.operator | nindent 6 }}
      containers:
        - name: operator
          image: {{ include "meles.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [operator]
          env:
            {{- include "meles.clamdClientEnv" . | nindent 12 }}
            - {name: MELES_PLATFORM, value: {{ .Values.operator.platform | quote }}}
            - {name: MELES_WORKERS, value: {{ .Values.operator.workers | quote }}}
            - {name: MELES_CONCURRENCY, value: {{ .Values.operator.concurrency | quote }}}
            - {name: MELES_RETRY_AFTER, value: {{ .Values.operator.retryAfter | quote }}}
            - {name: MELES_RETRY_INCOMPLETE_AFTER, value: {{ .Values.operator.retryIncompleteAfter | quote }}}
            - {name: MELES_PRUNE_INTERVAL, value: {{ .Values.operator.pruneInterval | quote }}}
            - {name: MELES_RESCAN_INTERVAL, value: {{ .Values.operator.rescanInterval | quote }}}
            - {name: MELES_MAX_FILE_SIZE, value: {{ .Values.scan.maxFileSize | quote }}}
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: health, containerPort: 8081}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "meles.clamdClientMounts" . | nindent 12 }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "meles.clamdClientVolumes" . | nindent 8 }}
{{- end }}
