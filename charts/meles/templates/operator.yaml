{{- if .Values.operator.enabled }}
{{- $fullname := include "meles.fullname" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
---
# Read pods (and the jobs and nodes behind them) in all namespaces, write
# MalwareReports. No access to secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources: [pods, nodes]
    verbs: [get, list, watch]
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [get, list, watch]
  - apiGroups: [meles.io]
    resources: [malwarereports]
    verbs: [get, list, watch, create, update, patch, delete]
  # Ignore rules: read, and report invalid or expired rules in the status.
  - apiGroups: [meles.io]
    resources: [malwareignores, clustermalwareignores]
    verbs: [get, list, watch]
  - apiGroups: [meles.io]
    resources: [malwareignores/status, clustermalwareignores/status]
    verbs: [update, patch]
---
# Reading the pull secrets of private images is opt-in per namespace: bind
# this role to the operator there (see the operator's error for the
# command), or cluster-wide with operator.pullSecrets.clusterWide. get on
# single objects only, no list or watch: the operator neither sees all
# secrets nor keeps them.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-pull-secret-reader
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [""]
    resources: [secrets, serviceaccounts]
    verbs: [get]
{{- if .Values.operator.pullSecrets.clusterWide }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-pull-secret-reader
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-pull-secret-reader
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-operator
    namespace: {{ .Release.Namespace }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-operator
    namespace: {{ .Release.Namespace }}
---
# Leader election in the release namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-operator-leader
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["", events.k8s.io]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-operator-leader
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-operator-leader
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-operator
    namespace: {{ .Release.Namespace }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  replicas: {{ if .Values.operator.gate.enabled }}{{ .Values.operator.gate.replicas }}{{ else }}1{{ end }}
  selector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  template:
    metadata:
      labels:
        {{- include "meles.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: operator
    spec:
      serviceAccountName: {{ $fullname }}-operator
      {{- include "meles.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- include "meles.scheduling" .Values.operator | nindent 6 }}
      containers:
        - name: operator
          image: {{ include "meles.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [operator]
          env:
            {{- include "meles.clamdClientEnv" . | nindent 12 }}
            - {name: MELES_PLATFORM, value: {{ .Values.operator.platform | quote }}}
            - {name: MELES_WORKERS, value: {{ .Values.operator.workers | quote }}}
            - {name: MELES_CONCURRENCY, value: {{ .Values.operator.concurrency | quote }}}
            - {name: MELES_RETRY_AFTER, value: {{ .Values.operator.retryAfter | quote }}}
            - {name: MELES_RETRY_INCOMPLETE_AFTER, value: {{ .Values.operator.retryIncompleteAfter | quote }}}
            - {name: MELES_PRUNE_INTERVAL, value: {{ .Values.operator.pruneInterval | quote }}}
            - {name: MELES_PULL_SECRET_ROLE, value: {{ printf "%s-pull-secret-reader" $fullname | quote }}}
            - {name: MELES_SERVICE_ACCOUNT, value: {{ printf "%s:%s-operator" .Release.Namespace $fullname | quote }}}
            {{- if .Values.operator.registryAuthSecret }}
            - {name: DOCKER_CONFIG, value: /docker}
            {{- end }}
            - {name: MELES_RESCAN_INTERVAL, value: {{ .Values.operator.rescanInterval | quote }}}
            - {name: MELES_MAX_FILE_SIZE, value: {{ .Values.scan.maxFileSize | quote }}}
            {{- if .Values.operator.gate.enabled }}
            - {name: MELES_GATE, value: "true"}
            - {name: MELES_GATE_FAIL_OPEN, value: {{ .Values.operator.gate.failOpen | quote }}}
            - {name: MELES_WEBHOOK_CERT_DIR, value: /tls}
            {{- end }}
            {{- with .Values.operator.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: health, containerPort: 8081}
            - {name: metrics, containerPort: 8080}
            {{- if .Values.operator.gate.enabled }}
            - {name: webhook, containerPort: 9443}
            {{- end }}
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            periodSeconds: 30
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            {{- include "meles.clamdClientMounts" . | nindent 12 }}
            {{- if .Values.operator.registryAuthSecret }}
            - {name: docker-config, mountPath: /docker, readOnly: true}
            {{- end }}
            {{- if .Values.operator.gate.enabled }}
            - {name: webhook-tls, mountPath: /tls, readOnly: true}
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- include "meles.clamdClientVolumes" . | nindent 8 }}
        {{- if .Values.operator.registryAuthSecret }}
        - name: docker-config
          secret:
            secretName: {{ .Values.operator.registryAuthSecret }}
            items:
              - {key: .dockerconfigjson, path: config.json}
        {{- end }}
        {{- if .Values.operator.gate.enabled }}
        - name: webhook-tls
          secret:
            secretName: {{ $fullname }}-operator-webhook-tls
        {{- end }}
---
# Headless: the name resolves to every replica, so that meles server finds
# the leader's /status; Prometheus scrapes /metrics of each.
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-operator-metrics
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
spec:
  clusterIP: None
  selector:
    {{- include "meles.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: operator
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
{{- if .Values.operator.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ $fullname }}-operator
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: operator
    {{- with .Values.operator.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: operator
  endpoints:
    - {port: metrics, path: /metrics, interval: {{ .Values.operator.serviceMonitor.interval }}}
{{- end }}
{{- end }}
