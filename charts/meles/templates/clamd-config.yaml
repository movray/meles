{{- if .Values.clamd.enabled }}
{{- $fullname := include "meles.fullname" . }}
{{- $fileSize := include "meles.bytes" .Values.scan.maxFileSize | atoi }}
{{- $scanWait := add (div (.Values.clamd.maxScanTime | int) 1000) 60 }}
{{- /* At least the file size, or large files would only be reported as Heuristics.Limits.Exceeded. */}}
{{- $scanSize := max (include "meles.bytes" .Values.clamd.maxScanSize | atoi) $fileSize }}
{{- if gt $fileSize 2147483647 }}
{{- fail "scan.maxFileSize: ClamAV cannot scan files larger than 2G minus 1 byte, use at most 2047M" }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $fullname }}-clamd
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: clamd
data:
  clamd.conf: |
    Foreground yes
    LogTime yes
    # No LogFile: clamd and freshclam refuse /dev/stdout (symlink); in the
    # foreground they log to the console anyway.
    DatabaseDirectory /var/lib/clamav
    TCPSocket 3310
    {{- if include "meles.clamdAuth" . }}
    # Only meles clamd-proxy in the same pod may connect.
    TCPAddr 127.0.0.1
    {{- end }}
    LocalSocket /tmp/clamd.sock
    # meles skips larger files itself and reports them; StreamMaxLength
    # rejects them too. Sizes in bytes: clamd does not accept every suffix
    # meles does (25MB, 25MiB).
    StreamMaxLength {{ $fileSize }}
    # MaxFileSize also applies to content clamd unpacks from a file. Random
    # bytes in a binary that look like a ZIP header may claim a size above
    # scan.maxFileSize (seen: 1 GiB in an 80 MB Go binary); with
    # MaxFileSize = scan.maxFileSize every such binary would stay
    # Incomplete. MaxScanSize bounds the work per file anyway. ClamAV cannot
    # handle files of 2 GiB and more.
    MaxFileSize {{ min $scanSize 2147483647 }}
    MaxScanSize {{ $scanSize }}
    MaxScanTime {{ .Values.clamd.maxScanTime | int }}
    MaxFiles {{ .Values.clamd.maxFiles | int }}
    MaxRecursion {{ .Values.clamd.maxRecursion | int }}
    # Answer Heuristics.Limits.Exceeded.* instead of a silent OK when a file
    # or archive exceeds a limit; meles lists such files as skipped.
    AlertExceedsMax yes
    MaxThreads {{ .Values.clamd.maxThreads }}
    MaxConnectionQueueLength 30
    # Sessions stay open while meles reads the next layer. While clamd scans
    # a file, the session is silent until the verdict: both timeouts must
    # outlast MaxScanTime, or clamd closes the connection (meles: EOF).
    IdleTimeout {{ max 120 $scanWait }}
    ReadTimeout {{ max 180 $scanWait }}
    CommandReadTimeout 30
    # yes: no scan pause during a reload, but almost twice the memory.
    ConcurrentDatabaseReload yes
    SelfCheck 3600
    {{- with .Values.clamd.extraConfig }}
    {{- . | nindent 4 }}
    {{- end }}
  freshclam.conf: |
    Foreground yes
    LogTime yes
    DatabaseDirectory /var/lib/clamav
    DatabaseOwner clamav
    {{- if .Values.mirror.enabled }}
    # Only the mirror talks to Cisco Talos.
    PrivateMirror http://{{ $fullname }}-mirror
    ScriptedUpdates no
    {{- else if .Values.clamd.freshclam.privateMirror }}
    PrivateMirror {{ .Values.clamd.freshclam.privateMirror }}
    ScriptedUpdates no
    {{- end }}
    Checks {{ .Values.clamd.freshclam.checksPerDay }}
    NotifyClamd /etc/clamav/clamd.conf
{{- end }}
