{{- if .Values.server.enabled }}
{{- $fullname := include "meles.fullname" . }}
{{- if not .Values.server.persistence.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  annotations:
    # Keep the run history on uninstall.
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.server.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.server.persistence.size }}
{{- end }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- if include "meles.clusterReports" . }}
---
# Read the operator's MalwareReports in all namespaces; patch only to set
# the meles.io/rescan annotation from the UI. With clusterReports.ignore,
# create and delete ignore rules from the UI.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
rules:
  - apiGroups: [meles.io]
    resources: [malwarereports]
    verbs: [get, list, watch{{ if .Values.server.clusterReports.rescan }}, patch{{ end }}]
  {{- if .Values.server.clusterReports.ignore }}
  - apiGroups: [meles.io]
    resources: [malwareignores, clustermalwareignores]
    verbs: [get, list, watch, create, delete]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-server
subjects:
  - kind: ServiceAccount
    name: {{ $fullname }}-server
    namespace: {{ .Release.Namespace }}
{{- end }}
---
# Web UI, JSON API, scheduler and run history (SQLite on a volume, so
# exactly one replica).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels:
      {{- include "meles.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "meles.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ $fullname }}-server
      # The token is only needed to read the cluster's MalwareReports.
      automountServiceAccountToken: {{ include "meles.clusterReports" . | eq "true" }}
      {{- include "meles.imagePullSecrets" . | nindent 6 }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      {{- include "meles.scheduling" .Values.server | nindent 6 }}
      containers:
        - name: server
          image: {{ include "meles.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: [server]
          env:
            {{- include "meles.clamdClientEnv" . | nindent 12 }}
            {{- include "meles.registryEnv" . | nindent 12 }}
            - {name: MELES_DB, value: /data/meles.db}
            {{- if .Values.server.oauth2Proxy.enabled }}
            # Only oauth2-proxy in the same pod may connect.
            - {name: MELES_LISTEN, value: "127.0.0.1:8080"}
            {{- end }}
            - {name: MELES_TIMEZONE, value: {{ .Values.server.timezone | quote }}}
            - {name: MELES_WORKERS, value: {{ .Values.server.workers | quote }}}
            - {name: MELES_CONCURRENCY, value: {{ .Values.server.concurrency | quote }}}
            - {name: MELES_MAX_FILE_SIZE, value: {{ .Values.scan.maxFileSize | quote }}}
            {{- if include "meles.clusterReports" . }}
            - {name: MELES_CLUSTER_REPORTS, value: "true"}
            - {name: MELES_CLUSTER_RESCAN, value: {{ .Values.server.clusterReports.rescan | quote }}}
            - {name: MELES_CLUSTER_IGNORE, value: {{ .Values.server.clusterReports.ignore | quote }}}
            - {name: MELES_HISTORY_DAYS, value: {{ .Values.server.clusterReports.historyDays | quote }}}
            {{- if .Values.operator.enabled }}
            - {name: MELES_OPERATOR_STATUS, value: {{ printf "http://%s-operator-metrics.%s.svc:8080" (include "meles.fullname" .) .Release.Namespace | quote }}}
            {{- end }}
            {{- end }}
            {{- if .Values.server.registryAuthSecret }}
            - {name: DOCKER_CONFIG, value: /docker}
            {{- end }}
            {{- with .Values.server.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if .Values.server.oauth2Proxy.enabled }}
          # The kubelet cannot reach 127.0.0.1; probe through oauth2-proxy,
          # which lets /healthz pass without login. Named ports only resolve
          # within the same container, hence the number.
          readinessProbe:
            httpGet: {path: /healthz, port: 4180}
          livenessProbe:
            httpGet: {path: /healthz, port: 4180}
            periodSeconds: 30
            failureThreshold: 5
          {{- else }}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          {{- end }}
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: tmp, mountPath: /tmp}
            {{- include "meles.clamdClientMounts" . | nindent 12 }}
            {{- include "meles.registryMounts" . | nindent 12 }}
            {{- if .Values.server.registryAuthSecret }}
            - {name: docker-config, mountPath: /docker, readOnly: true}
            {{- end }}
        {{- with .Values.server.oauth2Proxy }}
        {{- if .enabled }}
        - name: oauth2-proxy
          image: "{{ .image.repository }}:{{ .image.tag }}"
          imagePullPolicy: {{ .image.pullPolicy }}
          args:
            {{- range .allowedGroups }}
            - --allowed-group={{ . }}
            {{- end }}
            {{- range .emailDomains }}
            - --email-domain={{ . }}
            {{- end }}
            {{- if .providerCA.configMap }}
            - --provider-ca-file=/provider-ca/{{ .providerCA.key }}
            - --use-system-trust-store=true
            {{- end }}
            {{- with .extraArgs }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            - {name: OAUTH2_PROXY_HTTP_ADDRESS, value: "0.0.0.0:4180"}
            - {name: OAUTH2_PROXY_UPSTREAMS, value: "http://127.0.0.1:8080"}
            - {name: OAUTH2_PROXY_PROVIDER, value: oidc}
            - {name: OAUTH2_PROXY_OIDC_ISSUER_URL, value: {{ required "server.oauth2Proxy.issuerUrl is required" .issuerUrl | quote }}}
            - {name: OAUTH2_PROXY_CLIENT_ID, value: {{ .clientId | quote }}}
            - name: OAUTH2_PROXY_CLIENT_SECRET
              valueFrom:
                secretKeyRef: {name: {{ required "server.oauth2Proxy.existingSecret is required" .existingSecret }}, key: client-secret}
            - name: OAUTH2_PROXY_COOKIE_SECRET
              valueFrom:
                secretKeyRef: {name: {{ $fullname }}-oauth2-proxy, key: cookie-secret}
            - {name: OAUTH2_PROXY_COOKIE_SECURE, value: {{ .cookieSecure | quote }}}
            - {name: OAUTH2_PROXY_COOKIE_NAME, value: _meles_oauth2}
            {{- with .redirectUrl }}
            - {name: OAUTH2_PROXY_REDIRECT_URL, value: {{ . | quote }}}
            {{- end }}
            - {name: OAUTH2_PROXY_CODE_CHALLENGE_METHOD, value: S256}
            - {name: OAUTH2_PROXY_REVERSE_PROXY, value: "true"}
            - {name: OAUTH2_PROXY_SKIP_PROVIDER_BUTTON, value: "true"}
            # Kubelet probes; /healthz only reports whether the database works.
            - {name: OAUTH2_PROXY_SKIP_AUTH_ROUTES, value: "GET=^/healthz$"}
            - {name: OAUTH2_PROXY_SILENCE_PING_LOGGING, value: "true"}
          ports:
            - {name: http, containerPort: 4180}
          readinessProbe:
            httpGet: {path: /ping, port: http}
          livenessProbe:
            httpGet: {path: /ping, port: http}
            periodSeconds: 30
          resources:
            {{- toYaml .resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          {{- if .providerCA.configMap }}
          volumeMounts:
            - {name: provider-ca, mountPath: /provider-ca, readOnly: true}
          {{- end }}
        {{- end }}
        {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Values.server.persistence.existingClaim | default (printf "%s-server" $fullname) }}
        - name: tmp
          emptyDir: {}
        {{- include "meles.clamdClientVolumes" . | nindent 8 }}
        {{- include "meles.registryVolumes" . | nindent 8 }}
        {{- if and .Values.server.oauth2Proxy.enabled .Values.server.oauth2Proxy.providerCA.configMap }}
        - name: provider-ca
          configMap:
            name: {{ .Values.server.oauth2Proxy.providerCA.configMap }}
            items:
              - {key: {{ .Values.server.oauth2Proxy.providerCA.key }}, path: {{ .Values.server.oauth2Proxy.providerCA.key }}}
        {{- end }}
        {{- if .Values.server.registryAuthSecret }}
        - name: docker-config
          secret:
            secretName: {{ .Values.server.registryAuthSecret }}
            items:
              - {key: .dockerconfigjson, path: config.json}
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  selector:
    {{- include "meles.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - {name: http, port: {{ .Values.server.service.port }}, targetPort: http}
{{- if .Values.server.httpRoute.enabled }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  parentRefs:
    {{- required "server.httpRoute.parentRefs is required" .Values.server.httpRoute.parentRefs | toYaml | nindent 4 }}
  {{- with .Values.server.httpRoute.hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ $fullname }}-server
          port: {{ .Values.server.service.port }}
{{- end }}
{{- if .Values.server.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ $fullname }}-server
  labels:
    {{- include "meles.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  {{- with .Values.server.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.server.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.server.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ required "server.ingress.host is required" .Values.server.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ $fullname }}-server
                port: {name: http}
{{- end }}
{{- end }}
