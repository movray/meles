# meles server: web UI, JSON API, scheduler and run history (SQLite on a
# volume, so exactly one replica). It scans with the clamd workers.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meles-server
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meles-server
  labels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: server}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: server}
  template:
    metadata:
      labels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: server}
    spec:
      imagePullSecrets:
        - name: meles-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: server
          image: meles
          args: [server]
          env:
            - {name: MELES_CLAMD, value: "tcp://meles-clamd:3310"}
            - {name: MELES_DB, value: /data/meles.db}
            - {name: MELES_TIMEZONE, value: Europe/Berlin}
            - {name: MELES_WORKERS, value: "1"}
            - {name: MELES_CONCURRENCY, value: "4"}
            # Registry credentials for private images (optional secret).
            - {name: DOCKER_CONFIG, value: /docker}
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 30
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            # Buffers up to concurrency x max-file-size per scan plus the layer cache.
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: docker-config, mountPath: /docker, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: meles-server}
        - name: docker-config
          secret:
            secretName: meles-registry-auth
            optional: true
            items:
              - {key: .dockerconfigjson, path: config.json}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: meles-server
spec:
  selector: {app.kubernetes.io/name: meles, app.kubernetes.io/component: server}
  ports:
    - {name: http, port: 80, targetPort: http}
