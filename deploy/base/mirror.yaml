# DB mirror: the only component that talks to Cisco Talos. cvdupdate fetches
# the ClamAV databases at most once per hour; nginx serves them to the clamd
# workers (freshclam PrivateMirror). Both containers share one volume.
apiVersion: v1
kind: ConfigMap
metadata:
  name: meles-mirror
data:
  nginx.conf: |
    worker_processes 1;
    pid /tmp/nginx.pid;
    events { worker_connections 256; }
    http {
      client_body_temp_path /tmp/client_body;
      proxy_temp_path /tmp/proxy;
      fastcgi_temp_path /tmp/fastcgi;
      uwsgi_temp_path /tmp/uwsgi;
      scgi_temp_path /tmp/scgi;
      access_log off;
      server {
        listen 8080;
        root /mirror/db;
        autoindex off;
        location = /healthz { return 200 "ok\n"; }
        location / { try_files $uri =404; }
      }
    }
  update.sh: |
    #!/bin/sh
    set -eu
    export HOME=/tmp PATH="/tmp/.local/bin:$PATH"
    pip install --quiet --user --no-cache-dir "cvdupdate>=1.1,<2"
    cvd config set --dbdir /mirror/db --logdir /tmp/cvd-logs
    while true; do
      cvd update || echo "cvd update failed, retrying in an hour" >&2
      sleep 3600
    done
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: meles-mirror
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meles-mirror
  labels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: mirror}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: mirror}
  template:
    metadata:
      labels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: mirror}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: cvdupdate
          image: python:3.12-slim
          command: ["/bin/sh", "/scripts/update.sh"]
          resources:
            requests: {cpu: 10m, memory: 64Mi}
            limits: {memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: db, mountPath: /mirror}
            - {name: config, mountPath: /scripts}
            - {name: tmp, mountPath: /tmp}
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          command: ["nginx", "-g", "daemon off;", "-c", "/config/nginx.conf"]
          ports:
            - {name: http, containerPort: 8080}
          readinessProbe:
            httpGet: {path: /healthz, port: http}
          resources:
            requests: {cpu: 10m, memory: 16Mi}
            limits: {memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: db, mountPath: /mirror, readOnly: true}
            - {name: config, mountPath: /config}
            - {name: nginx-tmp, mountPath: /tmp}
      volumes:
        - name: db
          persistentVolumeClaim: {claimName: meles-mirror}
        - name: config
          configMap: {name: meles-mirror}
        - name: tmp
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: meles-mirror
spec:
  selector: {app.kubernetes.io/name: meles, app.kubernetes.io/component: mirror}
  ports:
    - {name: http, port: 80, targetPort: http}
