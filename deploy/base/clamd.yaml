# clamd workers: keep the signatures in memory and scan streams sent by
# meles over INSTREAM. Signatures come only from the in-cluster mirror.
apiVersion: v1
kind: ConfigMap
metadata:
  name: meles-clamd
data:
  clamd.conf: |
    Foreground yes
    LogTime yes
    # No LogFile: clamd and freshclam refuse /dev/stdout (symlink); in the
    # foreground they log to the console anyway.
    DatabaseDirectory /var/lib/clamav
    TCPSocket 3310
    LocalSocket /tmp/clamd.sock
    # meles skips larger files itself (--max-file-size 25M) and reports them.
    StreamMaxLength 25M
    MaxFileSize 25M
    MaxScanSize 100M
    MaxThreads 12
    MaxConnectionQueueLength 30
    # Sessions stay open while meles reads the next layer.
    IdleTimeout 120
    ReadTimeout 180
    CommandReadTimeout 30
    # yes: no scan pause during a reload, but almost twice the memory.
    ConcurrentDatabaseReload yes
    SelfCheck 3600
  freshclam.conf: |
    Foreground yes
    LogTime yes
    DatabaseDirectory /var/lib/clamav
    DatabaseOwner clamav
    # Only the mirror talks to Cisco Talos.
    PrivateMirror http://meles-mirror
    ScriptedUpdates no
    Checks 24
    NotifyClamd /etc/clamav/clamd.conf
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meles-clamd
  labels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: clamd}
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: clamd}
  template:
    metadata:
      labels: {app.kubernetes.io/name: meles, app.kubernetes.io/component: clamd}
    spec:
      securityContext:
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: clamd
          image: clamav/clamav:1.4
          env:
            - {name: CLAMAV_NO_MILTERD, value: "true"}
          ports:
            - {name: clamd, containerPort: 3310}
          # clamd accepts connections only once the database is loaded.
          startupProbe:
            exec: {command: ["clamdcheck.sh"]}
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            exec: {command: ["clamdcheck.sh"]}
            periodSeconds: 30
            timeoutSeconds: 10
          livenessProbe:
            exec: {command: ["clamdcheck.sh"]}
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            requests: {cpu: 100m, memory: 1536Mi}
            # A database reload briefly needs almost twice the memory.
            limits: {memory: 3Gi}
          # The image's entrypoint starts as root and drops to the clamav user.
          securityContext:
            allowPrivilegeEscalation: false
          volumeMounts:
            - {name: config, mountPath: /etc/clamav/clamd.conf, subPath: clamd.conf}
            - {name: config, mountPath: /etc/clamav/freshclam.conf, subPath: freshclam.conf}
            - {name: db, mountPath: /var/lib/clamav}
      volumes:
        - name: config
          configMap: {name: meles-clamd}
        - name: db
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: meles-clamd
spec:
  selector: {app.kubernetes.io/name: meles, app.kubernetes.io/component: clamd}
  ports:
    - {name: clamd, port: 3310, targetPort: clamd}
