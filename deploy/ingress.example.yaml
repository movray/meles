# Optional: expose the UI. meles has no login of its own, so put an
# authenticating proxy (e.g. oauth2-proxy with Keycloak) in front of it,
# or keep it reachable only via kubectl port-forward.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: meles
  namespace: meles
spec:
  ingressClassName: traefik
  rules:
    - host: meles-test.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: meles-server
                port: {name: http}
